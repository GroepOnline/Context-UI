name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  ci:
    # Public OSS CI is isolated on GitHub-hosted runners; no private fleet dependency.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '25.9.0'
          cache: npm

      - name: Install and test
        run: |
          npm ci
          npm run lint --if-present
          npm test --if-present
